# Vazante as a snap, built from source: installs the workspace, runs
# `pnpm --filter @vazante/desktop dist:dir` and packs release/linux-unpacked. The Snap Store's
# Builds tab builds and releases it to edge on every push to main; .github/workflows/snap.yml
# builds the same file and smoke-tests it.
name: vazante
title: Vazante
base: core22
adopt-info: vazante
icon: snap/gui/icon.png
summary: Real-time tactics against the zombie horde
description: |
  Command squads, run convoys and hold the last block of a fallen city.
  Vazante is a real-time tactics game: thousands of infected roam Porto
  Velário and every shot draws more of them. Escort supply trucks, build
  walls and machine-gun nests, keep your soldiers' nerve and survive the
  waves of the Choir. Campaign of four missions, a city-wide sandbox and
  five languages.
license: AGPL-3.0-or-later
website: https://gamestudio42.github.io/vazante/
source-code: https://github.com/gamestudio42/vazante
issues: https://github.com/gamestudio42/vazante/issues
contact: talkgamestudio42@gmail.com
grade: stable
confinement: strict
compression: lzo

architectures:
  - build-on: amd64

apps:
  vazante:
    # Chromium's own sandbox cannot run inside strict confinement; the snap sandbox replaces it.
    command: app/vazante --no-sandbox
    desktop: meta/gui/vazante.desktop
    extensions: [gnome]
    plugs:
      - browser-support
      - opengl
      - audio-playback
    environment:
      TMPDIR: $XDG_RUNTIME_DIR

parts:
  vazante:
    plugin: nil
    source: .
    build-snaps:
      - node/22/stable
    stage-packages:
      - libnspr4
      - libnss3
      - libxss1
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' apps/desktop/package.json)"
    override-build: |
      # The node snap is read-only: install the pinned pnpm next to the build.
      npm install --prefix "$CRAFT_PART_BUILD/.tools" "$(sed -n 's/^  "packageManager": "\(.*\)",$/\1/p' package.json)"
      export PATH="$CRAFT_PART_BUILD/.tools/node_modules/.bin:$PATH"
      pnpm install --frozen-lockfile
      pnpm --filter @vazante/desktop dist:dir
      mkdir -p "$CRAFT_PART_INSTALL/app"
      cp -a apps/desktop/release/linux-unpacked/. "$CRAFT_PART_INSTALL/app/"
