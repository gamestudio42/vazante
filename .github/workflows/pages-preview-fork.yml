# Publishes the site artifact produced by a fork pull request. This workflow is defined on main
# and never checks out or executes the fork. It only copies the already built files to gh-pages
# after the pull request head matches the run that uploaded them.
name: Pages preview from fork

on:
  workflow_run:
    workflows: ["CI and Pages"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Choose the preview artifact
        id: plan
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          names="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[].name')"
          deploy_n=""
          remove_n=""
          while IFS= read -r name; do
            [[ -z "$name" ]] && continue
            if [[ "$name" =~ ^preview-pr-([0-9]+)$ ]]; then
              [[ -n "$deploy_n" ]] && { echo "More than one preview artifact."; exit 1; }
              deploy_n="${BASH_REMATCH[1]}"
            elif [[ "$name" =~ ^preview-remove-pr-([0-9]+)$ ]]; then
              [[ -n "$remove_n" ]] && { echo "More than one removal artifact."; exit 1; }
              remove_n="${BASH_REMATCH[1]}"
            fi
          done <<< "$names"
          if [[ -n "$deploy_n" && -n "$remove_n" ]]; then
            echo "A run cannot both publish and remove a preview."
            exit 1
          fi
          mode=""
          number=""
          artifact=""
          if [[ -n "$deploy_n" ]]; then
            mode="deploy"
            number="$deploy_n"
            artifact="preview-pr-${deploy_n}"
          elif [[ -n "$remove_n" ]]; then
            mode="remove"
            number="$remove_n"
            artifact="preview-remove-pr-${remove_n}"
          else
            echo "No fork preview artifact on this run."
            exit 0
          fi
          pr_json="$(gh api "repos/${REPO}/pulls/${number}")"
          pr_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          pr_repo="$(jq -r '.head.repo.full_name // empty' <<< "$pr_json")"
          pr_state="$(jq -r '.state' <<< "$pr_json")"
          if [[ "$pr_sha" != "$HEAD_SHA" ]]; then
            echo "Pull request #${number} head does not match this run."
            exit 1
          fi
          if [[ "$mode" == "deploy" && "$pr_repo" != "$HEAD_REPO" ]]; then
            echo "Pull request #${number} repository does not match this run."
            exit 1
          fi
          if [[ "$mode" == "deploy" && "$pr_state" != "open" ]]; then
            echo "Refusing to publish a preview for a pull request that is ${pr_state}."
            exit 1
          fi
          {
            echo "mode=${mode}"
            echo "number=${number}"
            echo "artifact=${artifact}"
          } >> "$GITHUB_OUTPUT"

      # Checkout main so the deploy action has a git directory. The pull request head is never checked out.
      - uses: actions/checkout@v7
        if: steps.plan.outputs.mode == 'deploy' || steps.plan.outputs.mode == 'remove'
        with:
          ref: main
          persist-credentials: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: steps.plan.outputs.mode == 'deploy'
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: preview-site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1
        id: preview
        if: steps.plan.outputs.mode == 'deploy' || steps.plan.outputs.mode == 'remove'
        with:
          source-dir: preview-site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pr-number: ${{ steps.plan.outputs.number }}
          action: ${{ steps.plan.outputs.mode }}
          comment: false
          deploy-commit-message: Deploy preview for PR ${{ steps.plan.outputs.number }}
          remove-commit-message: Remove preview for PR ${{ steps.plan.outputs.number }}

      - uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        if: steps.plan.outputs.mode == 'deploy'
        with:
          header: pr-preview
          number: ${{ steps.plan.outputs.number }}
          message: |
            Preview: ${{ steps.preview.outputs.preview-url }}

            Built from this pull request. The page is removed when the pull request closes.

      - uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        if: steps.plan.outputs.mode == 'remove'
        with:
          header: pr-preview
          number: ${{ steps.plan.outputs.number }}
          message: Preview removed because the pull request was closed.
