# Checks every push and pull request. On main it publishes the browser build to GitHub Pages
# (gh-pages branch, site root). A pull request from this repository publishes a preview under
# /pr-preview/pr-<number>/ and removes it when the pull request closes. A pull request from a
# fork only uploads the built site; pages-preview-fork.yml publishes that artifact.
name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Merging a PR fires "push" on main and "pull_request closed" at the same
  # time; key PR runs by number so the cleanup never cancels the main deploy.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - uses: actions/upload-artifact@v5
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: web-dist
          path: apps/game/dist
          include-hidden-files: true
          retention-days: 3
      # Fork pull requests cannot push to gh-pages. The artifact name carries the pull request
      # number, because the workflow_run event does not include it for a fork.
      - uses: actions/upload-artifact@v5
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        with:
          name: preview-pr-${{ github.event.pull_request.number }}
          path: apps/game/dist
          include-hidden-files: true
          retention-days: 3

  # Closing a fork pull request has nothing to build. The marker tells the publisher to remove
  # the preview. The job never checks out the fork.
  fork-preview-close:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p marker && echo remove > marker/remove.txt
      - uses: actions/upload-artifact@v5
        with:
          name: preview-remove-pr-${{ github.event.pull_request.number }}
          path: marker
          retention-days: 1

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: gh-pages
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: site
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          # Keep the pull request previews that live next to the site.
          clean-exclude: pr-preview/

  preview:
    needs: check
    # Same-repository PRs only: forks cannot push to gh-pages.
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || needs.check.result == 'success')
    runs-on: ubuntu-latest
    concurrency: gh-pages
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        if: github.event.action != 'closed'
        with:
          name: web-dist
          path: preview-site
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: preview-site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
